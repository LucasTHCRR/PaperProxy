name: Feature Request
description: Suggest a feature for PaperProxy.
labels: ["type: feature"]
body:
  - type: textarea
    attributes:
      label: Requested Feature
      description: |
        Please describe as best as you can what you'd like to be added to PaperProxy.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Why is this needed?
      description: |
        Please describe why do you need this feature.
        Do you think it could be useful? Is it due to another problem?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternative Solutions
      description: |
        Are there any alternative solutions to implementing a new feature?
        What have you tried instead?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional Information
      description: Anything else you want to add.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Before submitting this request, please ensure the following:

        1. You are running the [latest release](https://github.com/LucasTHCRR/PaperProxy/releases/latest) of PaperProxy.
        2. You searched for and ensured there isn't already an open issue regarding this.
        3. The feature belongs on the proxy and not on the backend server.

        If you are unsure, feel free to ask on our [Discord](https://dc.gg/paperstream).
