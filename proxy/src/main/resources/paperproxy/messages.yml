    disbanded: "{prefix}<gray>The party was disbanded."
    not-in-party: "{prefix}<red>You are not in a party."
    not-member: "{prefix}<red><white>{player}</white> is not in your party."
    list: "{prefix}<gray>Party: <white>{players}"
