    not-leader: "{prefix}<red>Only the party leader can do that."
    already-in-party: "{prefix}<red>Already in a party."
    full: "{prefix}<red>The party is full."
    no-invite: "{prefix}<red>You have no open invite."
    joined: "{prefix}<white>{player}</white> <green>joined the party."
    left: "{prefix}<white>{player}</white> <gray>left the party."
